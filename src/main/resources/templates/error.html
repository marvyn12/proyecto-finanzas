<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Algo salió mal · Balance General</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,700&display=swap" rel="stylesheet">
    <style>
        :root { --guinda: #6c1d45; --tinta: #221c1f; --gris: #77707a; --linea: #e4dfe1; --fondo: #f4f2f0; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
               background: var(--fondo); color: var(--tinta); font-family: 'IBM Plex Sans', system-ui, sans-serif; }
        .caja { width: 100%; max-width: 560px; background: #fff; border: 1px solid var(--linea); border-top: 5px solid var(--guinda);
                border-radius: 12px; padding: 32px; }
        .codigo { font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--guinda); text-transform: uppercase; }
        h1 { font-family: 'Source Serif 4', Georgia, serif; font-size: 26px; margin: 6px 0 10px; }
        p { line-height: 1.55; margin: 0 0 12px; }
        .detalle { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; color: var(--gris); background: #faf8f9;
                   border: 1px solid var(--linea); border-radius: 8px; padding: 10px 12px; overflow-wrap: anywhere; }
        a.boton { display: inline-block; margin-top: 8px; padding: 10px 18px; border-radius: 8px; background: var(--guinda); color: #fff;
                  font-weight: 600; text-decoration: none; }
        a.boton:hover { background: #531535; }
    </style>
</head>
<body>
<main class="caja">
    <div class="codigo" th:text="${'Error ' + (status ?: '')}">Error</div>
    <h1 th:text="${titulo != null ? titulo : (status == 404 ? 'Esa página no existe' : (status == 405 ? 'Esa acción no se puede hacer así' : 'Algo salió mal'))}">Algo salió mal</h1>
    <p th:text="${mensaje != null ? mensaje : (status == 404 ? 'Revisa la dirección o regresa al inicio.' : 'Regresa al inicio e inténtalo otra vez. Tus datos guardados no se perdieron.')}">
        Regresa al inicio e inténtalo otra vez.</p>
    <p class="detalle" th:if="${detalle != null}" th:text="${detalle}">detalle técnico</p>
    <a class="boton" th:href="@{/}">Volver al balance</a>
</main>
</body>
</html>
